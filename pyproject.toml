[project]
name = "chatntq-rag"
version = "0.1.0"
description = "Hệ thống RAG tìm kiếm ngữ nghĩa với Google Gemini và FastAPI Web Interface"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Cấu hình tìm kiếm các module gói nguồn trong thư mục src/
[tool.setuptools.packages.find]
where = ["src"]
